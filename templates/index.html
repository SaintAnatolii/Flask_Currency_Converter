<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            height: 100vh;
            background-color: #2f2f2f;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form {
            width: 500px;
            height: 500px;
            background-color: #fff;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
        }
        form input {
            width: 250px;
            height: 50px;
            padding-left: 15px;   
        }
        form button {
            width: 250px;
            height: 50px;
            background-color: #000;
            color: #fff;   
        }
        form select {
            width: 250px;
            height: 50px; 
        }
    </style>
</head>
<body>
    <div class="container">
        
        <form action="/" method="post">
            <input type="number" name="money" step="0.01">
            <select name="rates">
                <option value="1">USD</option>
                <option value="2">EUR</option>
                <option value="3">CHY</option>
            </select>
            <button type="submit">Convert</button>

            <h1>Result : {{ total }}</h1>
        </form>
    </div>
</body>
</html>
